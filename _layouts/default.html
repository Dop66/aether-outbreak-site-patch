<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resumo | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icone-256.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="alternate" type="application/json" href="{{ '/noticias.json' | relative_url }}" title="Notícias (launcher)">
</head>
<body>
  <header class="topo">
    <div class="largura">
      <a class="marca" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="sub">Notícias e atualizações</span>
    </div>
  </header>
  <main class="largura">
    {{ content }}
  </main>
  <footer class="rodape">
    <div class="largura">{{ site.title }} · fase de testes</div>
  </footer>
</body>
</html>
